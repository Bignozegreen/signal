<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal — Sign In</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-logo">Signal</div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to your account</p>

        <div id="error-msg" class="error-msg hidden"></div>
        <div id="success-msg" class="success-msg hidden"></div>

        <form id="auth-form">
          <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <button type="submit" id="submit-btn" class="btn-submit">Sign In</button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="#" id="toggle-link">Create one</a>
        </p>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
